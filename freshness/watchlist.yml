# Sources behind policy-catalogue/, checked weekly by
# .github/workflows/source-freshness.yml (Mondays 03:30 UTC = 09:00 IST).
#
# For each source the check reports:
#   - commits to a watched file after `verified` (GitHub / GitLab files),
#   - wiki edits after `verified` (MediaWiki pages),
#   - any `anchors` phrase that is no longer on the page (catches rewrites and moves).
#
# After reviewing a reported change: update the catalogue entry (and the comparison
# page on the initiative site), then set `verified` to the review date and adjust
# `anchors` if the wording changed. `manual` sources cannot be fetched by CI (bot
# challenge) and are listed for a hand check on the first run of each month.

sources:
  - id: aethersdr
    verified: 2026-09-25
    github: [{repo: aethersdr/AetherSDR, path: CONTRIBUTING.md}]
    anchors: [{url: "https://raw.githubusercontent.com/aethersdr/AetherSDR/main/CONTRIBUTING.md", text: "Claude Code"}]

  - id: asahi-linux
